# Synthetic instance config for the tests (wired in tests/conftest.py).
# The ids mirror a real multi-WP server; the texts and collection ids are made up.

shared_presets = true

[[wps]]
id = "WP1-historie"
label = "WP1 – Historie"
description = "Testovací WP s místním vyhledáváním a připravenými otázkami."
collection_prefix = "wp1"
default_prompt = "wp1-ucitel"
default_collection = "wp1-histoedu"
local_retrieval = true
questions = [
  "Kdo byl Karel IV.?",
  "Co byla normalizace?",
]

[[wps.collections]]
id = "wp1-histoedu"
label = "wp1-histoedu-v2026-02"
msearch_collection_id = "00000000-0000-4000-8000-000000000001"

[[wps.prompts]]
id = "wp1-ucitel"
name = "Učitel"
system_prompt = '''
Jsi testovací učitel. Cituj zdroje jako [^Z1].

Délka: {length}'''
user_prompt_template = '''
Otázka:
{question}

Vlastní instrukce uživatele (může být prázdné):
{custom_instructions}

Nalezený kontext:
{retrieved_snippets}'''

